name = "two_stream_competitive_v3"
family = "rgbt_detector"
backbone_rgb = "resnet50_fpn"
backbone_tir = "resnet50_fpn"
fusion = "competitive_cross_modal_attention"
fusion_variant = "competitive"
neck = "enhanced_fpn"
neck_variant = "enhanced_fpn"
head = "coco_detection_head"
pretrained = true
anchor_sizes = [8, 16, 32, 64, 128]

[input]
image_width = 640
image_height = 512
normalize_rgb = true
normalize_tir = true

[augmentation]
horizontal_flip = 0.5
multi_scale_min = 0.8
multi_scale_max = 1.2
color_jitter_rgb = 0.2
tir_gain = 0.1
