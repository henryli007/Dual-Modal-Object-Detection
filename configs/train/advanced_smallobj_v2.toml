experiment_name = "advanced_smallobj_v2"
seed = 3407
num_workers = 8
batch_size = 4
epochs = 18
learning_rate = 0.00015
weight_decay = 0.0001
gradient_clip_norm = 1.0
mixed_precision = false
device = "cuda"
ema_decay = 0.9998

[optimizer]
name = "adamw"

[scheduler]
name = "cosine"
min_lr_ratio = 0.05

[logging]
log_interval = 20
save_interval = 1
output_dir = "outputs/models/advanced_smallobj_v2"

[evaluation]
metric = "coco_map"
primary_split = "val"
score_threshold = 0.03
tta_hflip = true
